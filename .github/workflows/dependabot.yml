name: Dependabot

# Reusable workflow that takes Dependabot pull requests to the default branch
# of every fallow-rs repository. A repository calls it from a small workflow
# that runs on `workflow_run` for its pull request workflows. See
# dependabot/README.md for the caller and the setup.
#
# - merge: after a successful run, merge the pull request when every check on
#   the head commit passed and the update is a minor or patch update.
# - triage: after a failed run, rerun it, ask for a repair, or hand the pull
#   request to a maintainer.
# - repair: Claude makes one local commit. This job installs and builds the
#   updated dependency, which is third-party code, so it holds no token that
#   can write.
# - publish: on a new runner that runs no project code, check the commit and
#   push it with the token of the fallow-dependabot GitHub App.

on:
  workflow_call:
    inputs:
      ignore-jobs:
        description: Regular expression for jobs that only repeat other results, such as an aggregator job.
        type: string
        default: ''
      flaky-jobs:
        description: Regular expression for jobs that can fail without a code cause. Triage reruns them once.
        type: string
        default: ''
      ignore-checks:
        description: Regular expression for checks that do not block a merge, such as a benchmark comparison.
        type: string
        default: ''
      generated-paths:
        description: Regular expression for generated files that a repair may change and that may merge without review.
        type: string
        default: ''
      review-generated-paths:
        description: Regular expression for generated files that do not count toward the size limit but need review.
        type: string
        default: ''
      manifest-paths:
        description: Regular expression for more manifest files, such as plugin manifests. A repair may only change version lines in them to merge without review.
        type: string
        default: ''
      app-login:
        description: Login of the App from DEPENDABOT_APP_CLIENT_ID. Its merge commits, which bring a branch up to date, count as automation.
        type: string
        default: 'fallow-dependabot[bot]'
      model:
        description: Claude model for the repair.
        type: string
        default: claude-sonnet-5-5
    secrets:
      ANTHROPIC_API_KEY:
        required: false
      CLAUDE_CODE_OAUTH_TOKEN:
        required: false
      DEPENDABOT_APP_PRIVATE_KEY:
        required: false

permissions: {}

env:
  GIT_CONFIG_COUNT: '2'
  GIT_CONFIG_KEY_0: maintenance.auto
  GIT_CONFIG_VALUE_0: 'false'
  GIT_CONFIG_KEY_1: gc.auto
  GIT_CONFIG_VALUE_1: '0'

jobs:
  merge:
    name: Merge
    # One merge decision at a time per repository. The check that an edited
    # pull request is on top of its base then sees every earlier merge.
    concurrency:
      group: dependabot-merge-${{ github.repository }}
      cancel-in-progress: false
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'pull_request' &&
      github.event.workflow_run.head_repository.full_name == github.repository &&
      startsWith(github.event.workflow_run.head_branch, 'dependabot/')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      # merge.mjs lists the Actions runs of the head commit. A private
      # repository needs this permission for that.
      actions: read
      checks: read
      contents: read
      pull-requests: read
      statuses: read
    steps:
      # job.workflow_sha selects this workflow's own scripts. Stop when it is
      # empty, so a caller's own files never run in its place.
      - name: Check the workflow commit
        env:
          WORKFLOW_SHA: ${{ job.workflow_sha }}
          WORKFLOW_REPOSITORY: ${{ job.workflow_repository }}
        run: test -n "$WORKFLOW_SHA" && test -n "$WORKFLOW_REPOSITORY"

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          repository: ${{ job.workflow_repository }}
          ref: ${{ job.workflow_sha }}
          sparse-checkout: dependabot

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'

      - id: decide
        env:
          GITHUB_TOKEN: ${{ github.token }}
          HEAD_BRANCH: ${{ github.event.workflow_run.head_branch }}
          RUN_HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
          IGNORE_CHECKS: ${{ inputs.ignore-checks }}
          APP_LOGIN: ${{ inputs.app-login }}
        run: node dependabot/merge.mjs

      - id: app
        if: (steps.decide.outputs.merge == 'true' || steps.decide.outputs.sync == 'true') && vars.DEPENDABOT_APP_CLIENT_ID != ''
        continue-on-error: true
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          client-id: ${{ vars.DEPENDABOT_APP_CLIENT_ID }}
          private-key: ${{ secrets.DEPENDABOT_APP_PRIVATE_KEY }}
          permission-contents: write
          permission-pull-requests: write
          permission-workflows: write

      # An edited branch merges only on top of the current base. The App
      # token starts CI on the new head, and that run decides again.
      - name: Bring the pull request up to date
        if: steps.decide.outputs.sync == 'true'
        env:
          GITHUB_TOKEN: ${{ steps.app.outputs.token }}
          PR: ${{ steps.decide.outputs.pr }}
          APP_LOGIN: ${{ inputs.app-login }}
        run: |
          if [ -z "$GITHUB_TOKEN" ]; then
            echo "::warning::Set the DEPENDABOT_APP_CLIENT_ID variable and the DEPENDABOT_APP_PRIVATE_KEY secret to update branches."
            exit 0
          fi
          node dependabot/sync.mjs

      # The App token, not GITHUB_TOKEN: GITHUB_TOKEN cannot merge a change to
      # a workflow file, and its push starts no workflow on the default branch.
      - name: Merge the pull request
        if: steps.decide.outputs.merge == 'true'
        env:
          GH_TOKEN: ${{ steps.app.outputs.token }}
          PR: ${{ steps.decide.outputs.pr }}
          HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
          EDITED: ${{ steps.decide.outputs.edited }}
          SUBJECT: ${{ steps.decide.outputs.subject }}
        run: |
          if [ -z "$GH_TOKEN" ]; then
            echo "::warning::Set the DEPENDABOT_APP_CLIENT_ID variable and the DEPENDABOT_APP_PRIVATE_KEY secret to merge."
            exit 0
          fi
          # Another merge may have moved the base since the decision. An edited
          # pull request then waits for its sync, so two repairs never both merge.
          if [ "$EDITED" = true ]; then
            base=$(gh pr view "$PR" --repo "$GITHUB_REPOSITORY" --json baseRefName --jq .baseRefName)
            behind=$(gh api "repos/$GITHUB_REPOSITORY/compare/$base...$HEAD_SHA" --jq .behind_by)
            if [ "$behind" != 0 ]; then
              echo "::notice::#$PR is $behind commits behind. The sweep brings it up to date."
              exit 0
            fi
          fi
          if ! gh pr merge "$PR" --repo "$GITHUB_REPOSITORY" --squash --match-head-commit "$HEAD_SHA" --subject "$SUBJECT"; then
            # The sweep or another run may have merged it first.
            state=$(gh pr view "$PR" --repo "$GITHUB_REPOSITORY" --json state --jq .state)
            [ "$state" = MERGED ] || exit 1
          fi

  # On the caller's schedule, check every open Dependabot pull request. This
  # merges a pull request whose last check came from an app, which starts no
  # workflow_run event.
  sweep:
    name: Sweep
    # One merge decision at a time per repository. The check that an edited
    # pull request is on top of its base then sees every earlier merge.
    concurrency:
      group: dependabot-merge-${{ github.repository }}
      cancel-in-progress: false
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      # merge.mjs lists the Actions runs of the head commit. A private
      # repository needs this permission for that.
      actions: read
      checks: read
      contents: read
      pull-requests: read
      statuses: read
    steps:
      # job.workflow_sha selects this workflow's own scripts. Stop when it is
      # empty, so a caller's own files never run in its place.
      - name: Check the workflow commit
        env:
          WORKFLOW_SHA: ${{ job.workflow_sha }}
          WORKFLOW_REPOSITORY: ${{ job.workflow_repository }}
        run: test -n "$WORKFLOW_SHA" && test -n "$WORKFLOW_REPOSITORY"

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          repository: ${{ job.workflow_repository }}
          ref: ${{ job.workflow_sha }}
          sparse-checkout: dependabot

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'

      - id: decide
        env:
          GITHUB_TOKEN: ${{ github.token }}
          SWEEP: '1'
          IGNORE_CHECKS: ${{ inputs.ignore-checks }}
          APP_LOGIN: ${{ inputs.app-login }}
        run: node dependabot/merge.mjs

      - id: app
        if: (steps.decide.outputs.prs != '[]' || steps.decide.outputs.syncs != '[]') && vars.DEPENDABOT_APP_CLIENT_ID != ''
        continue-on-error: true
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          client-id: ${{ vars.DEPENDABOT_APP_CLIENT_ID }}
          private-key: ${{ secrets.DEPENDABOT_APP_PRIVATE_KEY }}
          permission-contents: write
          permission-pull-requests: write
          permission-workflows: write

      # An edited branch merges only on top of the current base. The App
      # token starts CI on each new head, and that run decides again.
      - name: Bring the edited pull requests up to date
        if: steps.decide.outputs.syncs != '[]'
        env:
          GITHUB_TOKEN: ${{ steps.app.outputs.token }}
          SYNCS: ${{ steps.decide.outputs.syncs }}
          APP_LOGIN: ${{ inputs.app-login }}
        run: |
          if [ -z "$GITHUB_TOKEN" ]; then
            echo "::warning::Set the DEPENDABOT_APP_CLIENT_ID variable and the DEPENDABOT_APP_PRIVATE_KEY secret to update branches."
            exit 0
          fi
          printf '%s' "$SYNCS" | jq -r '.[]' | while read -r number; do
            PR="$number" node dependabot/sync.mjs \
              || echo "::notice::#$number was not updated. The next run checks it again."
          done

      # One merge at a time. A merge can put a later pull request in conflict;
      # Dependabot then rebases it, and its next run merges it.
      - name: Merge the ready pull requests
        if: steps.decide.outputs.prs != '[]'
        env:
          GH_TOKEN: ${{ steps.app.outputs.token }}
          PRS: ${{ steps.decide.outputs.prs }}
        run: |
          if [ -z "$GH_TOKEN" ]; then
            echo "::warning::Set the DEPENDABOT_APP_CLIENT_ID variable and the DEPENDABOT_APP_PRIVATE_KEY secret to merge."
            exit 0
          fi
          # The list puts edited pull requests first. After any merge the base
          # has moved, so a later edited one waits for its sync.
          merged=0
          while IFS=$'\t' read -r number sha edited subject; do
            # The fields come from the API. Check their shape before a merge.
            if ! [[ "$number" =~ ^[0-9]+$ && "$sha" =~ ^[0-9a-f]{40}$ ]]; then
              echo "::warning::Skipped an entry with an unexpected number or commit."
              continue
            fi
            if [ "$edited" = true ] && [ "$merged" -gt 0 ]; then
              echo "::notice::#$number is edited and the base moved. The next run brings it up to date."
              continue
            fi
            if gh pr merge "$number" --repo "$GITHUB_REPOSITORY" --squash --match-head-commit "$sha" --subject "$subject"; then
              merged=$((merged + 1))
            else
              echo "::notice::#$number did not merge. The next run checks it again."
            fi
          done < <(printf '%s' "$PRS" | jq -r '.[] | "\(.number)\t\(.sha)\t\(.edited)\t\(.subject)"')

  triage:
    name: Triage
    if: >-
      github.event.workflow_run.conclusion == 'failure' &&
      github.event.workflow_run.event == 'pull_request' &&
      github.event.workflow_run.head_repository.full_name == github.repository &&
      startsWith(github.event.workflow_run.head_branch, 'dependabot/')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      actions: write
      contents: read
      issues: write
      pull-requests: write
    outputs:
      action: ${{ steps.triage.outputs.action }}
    steps:
      # job.workflow_sha selects this workflow's own scripts. Stop when it is
      # empty, so a caller's own files never run in its place.
      - name: Check the workflow commit
        env:
          WORKFLOW_SHA: ${{ job.workflow_sha }}
          WORKFLOW_REPOSITORY: ${{ job.workflow_repository }}
        run: test -n "$WORKFLOW_SHA" && test -n "$WORKFLOW_REPOSITORY"

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          repository: ${{ job.workflow_repository }}
          ref: ${{ job.workflow_sha }}
          sparse-checkout: dependabot

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'

      - id: triage
        env:
          GITHUB_TOKEN: ${{ github.token }}
          RUN_ID: ${{ github.event.workflow_run.id }}
          RUN_ATTEMPT: ${{ github.event.workflow_run.run_attempt }}
          HEAD_BRANCH: ${{ github.event.workflow_run.head_branch }}
          RUN_HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
          LOG_FILE: ${{ runner.temp }}/failed-jobs.log
          IGNORE_JOBS: ${{ inputs.ignore-jobs }}
          FLAKY_JOBS: ${{ inputs.flaky-jobs }}
          APP_LOGIN: ${{ inputs.app-login }}
          # Without the App nothing can update the branch, so repair at once.
          CHECK_BEHIND: ${{ vars.DEPENDABOT_APP_CLIENT_ID != '' }}
        run: node dependabot/triage.mjs

      - id: app
        if: steps.triage.outputs.action == 'sync' && vars.DEPENDABOT_APP_CLIENT_ID != ''
        continue-on-error: true
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          client-id: ${{ vars.DEPENDABOT_APP_CLIENT_ID }}
          private-key: ${{ secrets.DEPENDABOT_APP_PRIVATE_KEY }}
          permission-contents: write
          permission-pull-requests: write
          permission-workflows: write

      # A repair builds on the current base, so two repairs cannot raise the
      # same version. The App token starts CI on the new head.
      - name: Bring the pull request up to date
        if: steps.triage.outputs.action == 'sync'
        env:
          GITHUB_TOKEN: ${{ steps.app.outputs.token }}
          PR: ${{ steps.triage.outputs.pr }}
          APP_LOGIN: ${{ inputs.app-login }}
        run: |
          if [ -z "$GITHUB_TOKEN" ]; then
            echo "::warning::Set the DEPENDABOT_APP_CLIENT_ID variable and the DEPENDABOT_APP_PRIVATE_KEY secret to update branches."
            exit 0
          fi
          node dependabot/sync.mjs

      - name: Rerun the failed jobs
        if: steps.triage.outputs.action == 'rerun'
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_ID: ${{ github.event.workflow_run.id }}
        run: gh run rerun "$RUN_ID" --failed --repo "$GITHUB_REPOSITORY"

      - name: Hand the pull request to a maintainer
        if: steps.triage.outputs.action == 'give-up'
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ steps.triage.outputs.pr }}
          REASON: ${{ steps.triage.outputs.reason }}
          FAILED_JOBS: ${{ steps.triage.outputs.failed_jobs }}
          RUN_URL: ${{ github.event.workflow_run.html_url }}
        run: |
          set -euo pipefail
          labels=$(gh pr view "$PR" --repo "$GITHUB_REPOSITORY" --json labels --jq '[.labels[].name] | join(",")')
          case ",$labels," in
            *,needs-human,*) exit 0 ;;
          esac
          gh label create needs-human --repo "$GITHUB_REPOSITORY" --color D93F0B \
            --description "Automation cannot finish this pull request" 2>/dev/null || true
          gh pr edit "$PR" --repo "$GITHUB_REPOSITORY" --add-label needs-human
          printf 'The repair automation stopped: %s.\n\nFailed jobs: %s\nRun: %s\n' \
            "$REASON" "$FAILED_JOBS" "$RUN_URL" > "$RUNNER_TEMP/comment.md"
          gh pr comment "$PR" --repo "$GITHUB_REPOSITORY" --body-file "$RUNNER_TEMP/comment.md"

  repair:
    name: Repair
    needs: triage
    if: needs.triage.outputs.action == 'repair'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      actions: read
      contents: read
      # The triage step lists the pull requests of the branch. A private
      # repository needs this permission for that.
      pull-requests: read
    outputs:
      action: ${{ steps.triage.outputs.action }}
      pr: ${{ steps.triage.outputs.pr }}
      ready: ${{ steps.auth.outputs.ready }}
    env:
      # Remove the Anthropic and GitHub secrets from the environment of every
      # command Claude runs.
      CLAUDE_CODE_SUBPROCESS_ENV_SCRUB: '1'
    steps:
      # job.workflow_sha selects this workflow's own scripts. Stop when it is
      # empty, so a caller's own files never run in its place.
      - name: Check the workflow commit
        env:
          WORKFLOW_SHA: ${{ job.workflow_sha }}
          WORKFLOW_REPOSITORY: ${{ job.workflow_repository }}
        run: test -n "$WORKFLOW_SHA" && test -n "$WORKFLOW_REPOSITORY"

      # The scripts and the instructions come from this workflow's own commit,
      # and the repository notes from the default branch of the caller. A
      # Dependabot branch is never trusted for them.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          repository: ${{ job.workflow_repository }}
          ref: ${{ job.workflow_sha }}
          path: trusted
          sparse-checkout: dependabot

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          path: notes
          sparse-checkout: .github/dependabot-repair.md
          sparse-checkout-cone-mode: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'

      # Triage again. This collects the failed job logs and stops when a newer
      # commit already replaced the failed run.
      - id: triage
        env:
          GITHUB_TOKEN: ${{ github.token }}
          RUN_ID: ${{ github.event.workflow_run.id }}
          RUN_ATTEMPT: ${{ github.event.workflow_run.run_attempt }}
          HEAD_BRANCH: ${{ github.event.workflow_run.head_branch }}
          RUN_HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
          LOG_FILE: ${{ runner.temp }}/failed-jobs.log
          IGNORE_JOBS: ${{ inputs.ignore-jobs }}
          FLAKY_JOBS: ${{ inputs.flaky-jobs }}
          APP_LOGIN: ${{ inputs.app-login }}
          CHECK_BEHIND: 'false'
        run: |
          node trusted/dependabot/triage.mjs
          cp trusted/dependabot/instructions.md "$RUNNER_TEMP/instructions.md"
          if [ -s notes/.github/dependabot-repair.md ]; then
            cp notes/.github/dependabot-repair.md "$RUNNER_TEMP/repository-notes.md"
            echo "notes=$RUNNER_TEMP/repository-notes.md" >> "$GITHUB_OUTPUT"
          else
            echo "notes=none" >> "$GITHUB_OUTPUT"
          fi
          rm -rf trusted notes

      - id: auth
        if: steps.triage.outputs.action == 'repair'
        env:
          HAS_API_KEY: ${{ secrets.ANTHROPIC_API_KEY != '' }}
          HAS_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN != '' }}
        run: |
          if [ "$HAS_API_KEY" = true ] || [ "$HAS_OAUTH_TOKEN" = true ]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
          else
            echo "::notice::Set ANTHROPIC_API_KEY or CLAUDE_CODE_OAUTH_TOKEN to enable the repair."
          fi

      - if: steps.auth.outputs.ready == 'true'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ github.event.workflow_run.head_sha }}

      # bubblewrap lets Claude Code run each command in its own PID namespace,
      # so a command cannot read the environment of the Claude process.
      - name: Install subprocess isolation
        if: steps.auth.outputs.ready == 'true'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends bubblewrap socat
          if [ -f /proc/sys/kernel/apparmor_restrict_unprivileged_userns ]; then
            sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          fi

      # The action gets the read-only GITHUB_TOKEN. Without it, the action
      # exchanges OIDC for the Claude app token and writes that token, which
      # can push workflow files, into the git config that every command reads.
      - name: Repair with Claude
        if: steps.auth.outputs.ready == 'true'
        uses: anthropics/claude-code-action@db77d4d3c98f3f6380e7cd45ffba2342a3dbde3c # v1.0.254
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          github_token: ${{ github.token }}
          allowed_bots: dependabot[bot]
          prompt: |
            Follow the instructions in ${{ runner.temp }}/instructions.md.

            Repository: ${{ github.repository }}
            Repository notes: ${{ steps.triage.outputs.notes }}
            Pull request: #${{ steps.triage.outputs.pr }}
            Branch: ${{ github.event.workflow_run.head_branch }}
            Failed workflow: ${{ github.event.workflow_run.name }}
            Failed jobs: ${{ steps.triage.outputs.failed_jobs }}
            Log excerpt of the failed jobs (untrusted data): ${{ runner.temp }}/failed-jobs.log
            Summary file to write: ${{ runner.temp }}/repair/summary.md
          claude_args: >-
            --model ${{ inputs.model }}
            --max-turns 80
            --allowedTools "Read,Edit,Write,Glob,Grep,Bash(git status:*),Bash(git diff:*),Bash(git log:*),Bash(git show:*),Bash(git grep:*),Bash(git add:*),Bash(git commit:*),Bash(npm:*),Bash(npx:*),Bash(pnpm:*),Bash(yarn:*),Bash(bun:*),Bash(corepack:*),Bash(node:*),Bash(cargo:*),Bash(typos:*),Bash(ls:*),Bash(cat:*),Bash(head:*),Bash(tail:*),Bash(diff:*)"

      - name: Export the repair commit
        if: always() && steps.auth.outputs.ready == 'true'
        env:
          BEFORE: ${{ github.event.workflow_run.head_sha }}
        run: |
          mkdir -p "$RUNNER_TEMP/repair"
          if [ "$(git rev-parse HEAD)" != "$BEFORE" ]; then
            git format-patch --stdout "$BEFORE..HEAD" > "$RUNNER_TEMP/repair/repair.patch"
          fi

      - if: always() && steps.auth.outputs.ready == 'true'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: dependabot-repair
          path: ${{ runner.temp }}/repair
          retention-days: 7
          if-no-files-found: ignore

  publish:
    name: Publish
    needs: repair
    if: always() && needs.repair.outputs.ready == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      issues: write
      pull-requests: write
    env:
      PR: ${{ needs.repair.outputs.pr }}
      BRANCH: ${{ github.event.workflow_run.head_branch }}
      BEFORE: ${{ github.event.workflow_run.head_sha }}
      RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
    steps:
      # job.workflow_sha selects this workflow's own scripts. Stop when it is
      # empty, so a caller's own files never run in its place.
      - name: Check the workflow commit
        env:
          WORKFLOW_SHA: ${{ job.workflow_sha }}
          WORKFLOW_REPOSITORY: ${{ job.workflow_repository }}
        run: test -n "$WORKFLOW_SHA" && test -n "$WORKFLOW_REPOSITORY"

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          repository: ${{ job.workflow_repository }}
          ref: ${{ job.workflow_sha }}
          path: trusted
          sparse-checkout: dependabot

      - run: |
          cp trusted/dependabot/guard.mjs trusted/dependabot/publish.mjs "$RUNNER_TEMP/"
          rm -rf trusted

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ github.event.workflow_run.head_sha }}

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        continue-on-error: true
        with:
          name: dependabot-repair
          path: ${{ runner.temp }}/repair

      # The patch comes from a runner that ran third-party code, so the guard
      # from this workflow's own commit checks it before any token exists here.
      - id: check
        env:
          GENERATED_PATHS: ${{ inputs.generated-paths }}
          REVIEW_GENERATED_PATHS: ${{ inputs.review-generated-paths }}
          MANIFEST_PATHS: ${{ inputs.manifest-paths }}
        run: |
          set -euo pipefail
          patch="$RUNNER_TEMP/repair/repair.patch"
          if [ ! -s "$patch" ]; then
            echo "result=none" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          # This local commit is only for the guard. publish.mjs sends its
          # changes as a commit that GitHub signs for the App.
          git config user.name 'Dependabot repair'
          git config user.email 'repair@localhost'
          git am --quiet "$patch"
          git commit --amend --no-edit --quiet --reset-author
          if node "$RUNNER_TEMP/guard.mjs" > "$RUNNER_TEMP/guard.txt"; then
            echo "result=accepted" >> "$GITHUB_OUTPUT"
          else
            echo "result=rejected" >> "$GITHUB_OUTPUT"
          fi

      # This token sets the review state. The merge of an update of a workflow
      # action needs `workflows`.
      - id: merge-token
        if: steps.check.outputs.result == 'accepted' && vars.DEPENDABOT_APP_CLIENT_ID != ''
        continue-on-error: true
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          client-id: ${{ vars.DEPENDABOT_APP_CLIENT_ID }}
          private-key: ${{ secrets.DEPENDABOT_APP_PRIVATE_KEY }}
          permission-contents: write
          permission-pull-requests: write
          permission-workflows: write

      # A repair of generated files or snapshots is pushed and merges like the
      # update itself. Any other repair is not pushed: a push from the App
      # starts the pull request CI with the repository secrets, so a
      # maintainer reviews the patch first. GitHub auto-merge would ignore the
      # needs-review label, so it is turned off.
      - id: mode
        if: steps.check.outputs.result == 'accepted'
        env:
          GH_TOKEN: ${{ steps.merge-token.outputs.token }}
          MERGE: ${{ steps.check.outputs.merge }}
        run: |
          set -euo pipefail
          if [ -z "$GH_TOKEN" ]; then
            echo "mode=no-token" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if [ "$MERGE" = auto ]; then
            echo "mode=auto" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          gh pr merge "$PR" --repo "$GITHUB_REPOSITORY" --disable-auto 2>/dev/null || true
          gh label create needs-review --repo "$GITHUB_REPOSITORY" --color FBCA04 \
            --description "A maintainer must review this pull request" 2>/dev/null || true
          gh pr edit "$PR" --repo "$GITHUB_REPOSITORY" --add-label needs-review
          echo "mode=review" >> "$GITHUB_OUTPUT"

      # The push token can write contents only, so a guard bug cannot push a
      # workflow file.
      - id: push-token
        if: steps.mode.outputs.mode == 'auto'
        continue-on-error: true
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          client-id: ${{ vars.DEPENDABOT_APP_CLIENT_ID }}
          private-key: ${{ secrets.DEPENDABOT_APP_PRIVATE_KEY }}
          permission-contents: write

      # GitHub creates and signs the commit for the App, on top of BEFORE
      # only, and publish.mjs checks that its tree is the checked tree.
      - id: push
        if: steps.push-token.outputs.token != ''
        env:
          GITHUB_TOKEN: ${{ steps.push-token.outputs.token }}
        run: |
          set -euo pipefail
          node "$RUNNER_TEMP/publish.mjs"
          echo "result=pushed" >> "$GITHUB_OUTPUT"

      # The summary comes from the repair runner, so the comment shows it in
      # a code block, where links and mentions do nothing.
      - name: Report the result
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          CHECK: ${{ steps.check.outputs.result }}
          RESULT: ${{ steps.push.outputs.result }}
          MODE: ${{ steps.mode.outputs.mode }}
          PATCH_LIMIT: '30000'
        run: |
          set -euo pipefail
          comment="$RUNNER_TEMP/comment.md"
          # Six backticks, written as octal so the script holds none.
          fence=$(printf '\140%.0s' 1 2 3 4 5 6)
          fenced() {
            printf '\n%stext\n' "$fence"
            head -c "$PATCH_LIMIT" "$1" | sed "s/$fence/[fence]/g"
            printf '\n%s\n' "$fence"
          }
          label=needs-human
          case "$CHECK/$MODE/$RESULT" in
            accepted/auto/pushed)
              label=""
              echo "The repair workflow pushed a commit that changes only generated files. The pull request merges when every check passes." > "$comment" ;;
            accepted/review/*)
              label=""
              patch="$RUNNER_TEMP/repair/repair.patch"
              sum=$(sha256sum "$patch" | cut -d' ' -f1)
              size=$(wc -c < "$patch")
              {
                echo "The repair workflow made a commit that changes code, so it did not push it. Review the full patch, then apply it in a checkout of the pull request branch. The command checks that the patch is the one listed here:"
                printf '\n%sbash\n' "$fence"
                printf 'gh run download %s --repo %s --name dependabot-repair --dir /tmp/dependabot-repair\n' "$GITHUB_RUN_ID" "$GITHUB_REPOSITORY"
                printf 'echo "%s  /tmp/dependabot-repair/repair.patch" | sha256sum -c -\n' "$sum"
                echo "git am /tmp/dependabot-repair/repair.patch && git push"
                printf '%s\n' "$fence"
                echo
                echo "Changed files:"
                git diff --stat=200 "$BEFORE" HEAD > "$RUNNER_TEMP/stat.txt"
                fenced "$RUNNER_TEMP/stat.txt"
                if [ "$size" -gt "$PATCH_LIMIT" ]; then
                  echo
                  echo "The patch has $size bytes. This comment shows the first $PATCH_LIMIT bytes only. Read the full patch from the run artifacts before you apply it."
                fi
                echo
                echo "Patch:"
                fenced "$patch"
              } > "$comment" ;;
            accepted/auto/*)
              echo "The repair workflow could not push the commit. The patch is in the run artifacts." > "$comment" ;;
            accepted/*)
              echo "The repair workflow did not push the commit: set up the fallow-dependabot GitHub App. The patch is in the run artifacts." > "$comment" ;;
            rejected/*)
              echo "The repair workflow did not push the commit. The guard rejected it:" > "$comment"
              fenced "$RUNNER_TEMP/guard.txt" >> "$comment" ;;
            *)
              echo "The repair workflow made no commit." > "$comment" ;;
          esac
          if [ -s "$RUNNER_TEMP/repair/summary.md" ]; then
            printf '\nSummary from the repair run:\n' >> "$comment"
            fenced "$RUNNER_TEMP/repair/summary.md" >> "$comment"
          fi
          printf '\n[Repair run](%s)\n' "$RUN_URL" >> "$comment"
          if [ -n "$label" ]; then
            gh label create "$label" --repo "$GITHUB_REPOSITORY" --color D93F0B \
              --description "Automation cannot finish this pull request" 2>/dev/null || true
            gh pr edit "$PR" --repo "$GITHUB_REPOSITORY" --add-label "$label"
          fi
          gh pr comment "$PR" --repo "$GITHUB_REPOSITORY" --body-file "$comment"
